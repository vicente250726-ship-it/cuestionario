<style>

    --ahumada-red: #E30613;
    --ahumada-red-dark: #BE0510;
    --ahumada-red-soft: #FEF2F2;
    --ahumada-red-border: #FECACA;
    --ahumada-navy: #0E2244;
    --ahumada-navy-soft: #EFF4FA;
    --ahumada-teal: #17B2B5;
    --ink: #0F172A;
    --muted: #475569;
    --line: #E2E8F0;
    --bg: #F6F8FB;
    --white: #FFFFFF;
    --green: #059669;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Top Promo Bar */
  .top-promo-bar {
    background: var(--ahumada-burgundy);
    color: var(--white);
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    border-bottom: 3px solid var(--ahumada-red);
    letter-spacing: 0.01em;
  }

  /* Header responsivo sin desborde en iPhone */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 30;
    padding: 10px 16px;
    box-shadow: 0 2px 10px rgba(14, 34, 68, 0.04);
  }
  .header-inner {
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    text-decoration: none;
    max-width: 100%;
    min-width: 0;
  }
  .brand img {
    height: 32px;
    width: auto;
    max-width: 170px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }
  .brand-divider {
    width: 1px;
    height: 22px;
    background: var(--line);
    flex-shrink: 0;
  }
  .brand-tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--ahumada-navy);
    background: var(--ahumada-navy-soft);
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill-btn {
    border: 1.5px solid var(--line);
    background: var(--white);
    color: var(--ahumada-navy);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s, color 0.15s;
  }
  @media (hover: hover) and (pointer: fine) {
    .pill-btn:hover { border-color: var(--ahumada-red); color: var(--ahumada-red); }
    .option-card:hover { border-color: var(--ahumada-red); background: var(--ahumada-red-soft); }
    .btn-primary:hover { background: var(--ahumada-red-dark); }
    .btn-secondary:hover { border-color: var(--ahumada-navy); }
    .cart-btn:hover { background: #173566; }
    .btn-add:hover { background: var(--ahumada-red-dark); }
    .btn-link:hover { border-color: var(--ahumada-navy); }
    .btn-remove:hover { color: var(--ahumada-red); border-color: var(--ahumada-red-border); }
  }
  .pill-btn.active { background: var(--ahumada-red); color: var(--white); border-color: var(--ahumada-red); }
  .cart-btn {
    background: var(--ahumada-navy);
    color: var(--white);
    border: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cart-badge {
    background: var(--ahumada-red);
    color: var(--white);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 800;
  }

  @media (max-width: 640px) {
    header { padding: 10px 14px; }
    .header-inner { flex-direction: column; align-items: stretch; gap: 8px; }
    .brand { justify-content: space-between; }
    .brand-divider { display: none; }
    .nav-actions { justify-content: space-between; }
    .pill-btn { padding: 6px 10px; font-size: 12px; }
  }

  /* Sync bar oculta */
  .sync-bar { display: none !important; }

  /* Main container */
  main {
    flex: 1;
    max-width: 880px;
    width: 100%;
    margin: 20px auto 40px;
    padding: 0 14px;
  }

  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 10px 28px rgba(14, 34, 68, 0.05);
  }
  @media (min-width: 640px) {
    .card { padding: 30px; }
  }

  .progress-wrap { margin-bottom: 20px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--ahumada-navy); margin-bottom: 6px; }
  .progress-track { width: 100%; height: 7px; background: #E2E8F0; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--ahumada-red), var(--ahumada-burgundy)); transition: width 0.25s ease; }

  h1 { font-size: 24px; font-weight: 800; color: var(--ahumada-navy); letter-spacing: -0.02em; margin-bottom: 8px; line-height: 1.22; }
  h2 { font-size: 21px; font-weight: 800; color: var(--ahumada-navy); letter-spacing: -0.02em; margin-bottom: 6px; line-height: 1.25; }
  @media (min-width: 640px) {
    h1 { font-size: 27px; }
    h2 { font-size: 23px; }
  }
  .lead { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin-bottom: 20px; }

  .field-group { margin-bottom: 20px; }
  .field-label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px; color: var(--ahumada-navy); }
  .text-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  .text-input:focus { border-color: var(--ahumada-red); }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
    gap: 11px;
    margin-bottom: 20px;
  }
  .option-card {
    border: 1.5px solid var(--line);
    background: var(--white);
    border-radius: 16px;
    padding: 15px 17px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.14s, background-color 0.14s, transform 0.1s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    outline: none;
  }
  .option-card:active {
    transform: scale(0.99);
  }
  .option-card.selected,
  .option-card.flash-confirm {
    border-color: var(--ahumada-red) !important;
    background: var(--ahumada-red-soft) !important;
    box-shadow: 0 0 0 2px rgba(227, 6, 19, 0.16);
  }
  .option-title { font-weight: 800; font-size: 15px; color: var(--ahumada-navy); }
  .option-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }

  .btn-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--ahumada-red);
    color: var(--white);
    border: none;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14.5px;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary {
    background: var(--white);
    color: var(--ahumada-navy);
    border: 1.5px solid var(--line);
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

    background: linear-gradient(135deg, var(--ahumada-navy) 0%, #17366B 100%);
    color: var(--white);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .profile-summary-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .profile-badge-title {
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #93C5FD;
  }
  .profile-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .profile-chip {
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: var(--white);
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
  }

    background: var(--ahumada-red-soft);
    border: 1.5px solid var(--ahumada-red-border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .routine-hero-info strong {
    display: block;
    font-size: 14.5px;
    color: var(--ahumada-navy);
  }
  .routine-hero-info span {
    font-size: 12.5px;
    color: var(--muted);
  }

  /* Budget switcher */
  .budget-switcher {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--ahumada-navy-soft);
    padding: 10px 14px;
    border-radius: 14px;
    margin-bottom: 18px;
    border: 1px solid #DBEAFE;
  }
  .budget-switcher span { font-size: 13px; font-weight: 800; color: var(--ahumada-navy); margin-right: 4px; }

  .product-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
  .product-card {
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 16px;
    align-items: start;
    background: var(--white);

    .product-card { grid-template-columns: 1fr; }
    .product-img-box { width: 100%; height: 140px; }

    width: 112px;
    height: 112px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--white);
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 8px;

    max-height: 100%;
    object-fit: contain;
  }
  .img-placeholder {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--ahumada-navy);
    line-height: 1.35;
  }

    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--white);
    background: var(--ahumada-navy);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .opt-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #0F766E;
    background: #CCFBF1;
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 6px;

  .prod-brand { font-size: 12px; font-weight: 700; color: var(--muted); }
  .prod-title { font-size: 16px; font-weight: 800; color: var(--ahumada-navy); margin: 2px 0 6px; }

    position: fixed;
    inset: 0;
    background: rgba(14, 34, 68, 0.45);

    position: fixed;
    top: 0;
    right: 0;

  .drawer-head {
    padding: 18px 20px;

    justify-content: space-between;
    align-items: center;

  .cart-item {

    border-radius: 14px;
    padding: 12px;
    display: flex;
    justify-content: space-between;

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ahumada-navy);
    color: var(--white);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    z-index: 60;
    display: none;
  }
</style>

function createEmptyAnswers() {
  return {
    piel: "",
    necesidad: "",
    textura: "",
    presupuesto: "",
    menNota: "",
    menUsa: [],
    menTextura: "",
    menInicio: "",
    beautyCobertura: "",
    beautyAcabado: ""
  };
}

const state = {
  catalog: FALLBACK_CATALOG.productos || [],
  updatedAt: FALLBACK_CATALOG.ultima_actualizacion || "",
  sourceMode: "respaldo",
  screen: "welcome",
  stepIndex: 0,
  isAdvancing: false,
  name: "",
  gender: "",
  module: "Dermocosmetica",
  isMenBeginner: false,
  answers: createEmptyAnswers(),
  excludedSkus: [],
  cart: []
};

async function loadCatalog() {
  try {
    const res = await fetch("./catalogo.json?v=" + Date.now());
    if (res.ok) {
      const data = await res.json();
      if (data && Array.isArray(data.productos) && data.productos.length > 0) {
        state.catalog = data.productos;
        state.updatedAt = data.ultima_actualizacion || "";
        state.sourceMode = "vivo";
      }
    }
  } catch (e) {}
  render();
}

function formatCLP(num) {
  return "$" + Number(num || 0).toLocaleString("es-CL");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2600);
}

function buildRationale(prod, profile) {
  if (state.module === "Belleza") {
    return `Seleccionado para lograr un acabado ${profile.acabado.toLowerCase()} con cobertura ${profile.cobertura.toLowerCase()}.`;
  }
  const parts = [];
  if (profile.skin) parts.push(`piel ${profile.skin.toLowerCase()}`);
  if (profile.need && profile.need !== "Nada en particular") parts.push(`objetivo ${profile.need.toLowerCase()}`);
  if (profile.texture) parts.push(`textura ${profile.texture.toLowerCase()}`);
  return parts.length
    ? `Elegido porque buscabas cuidado para ${parts.join(" · ")}.`
    : `Fórmula dermatológica equilibrada para tu rutina diaria.`;
}

function getResolvedProfile() {
  if (state.module === "Belleza") {
    return {
      cobertura: state.answers.beautyCobertura || "Natural",
      acabado: state.answers.beautyAcabado || "Luminoso"
    };
  }
  const budget = state.answers.presupuesto || "Medio";
  if (state.isMenBeginner) {
    const texture = (state.answers.menTextura && state.answers.menTextura !== "Sin preferencia") ? state.answers.menTextura : "";
    const nota = state.answers.menNota;
    let skin = "Normal", need = "Nada en particular";
    if (nota === "Brillo") { skin = "Grasa"; need = "Brillo"; }
    else if (nota === "Tirantez o resequedad") { skin = "Seca"; need = "Tirantez"; }
    else if (nota === "Molestias después del afeitado") { skin = "Sensible"; need = "Afeitado"; }
    return { skin, need, texture, budget };
  }
  return {
    skin: state.answers.piel || "Mixta",
    need: state.answers.necesidad || "Brillo",
    texture: state.answers.textura || "",
    budget
  };
}

function getRecommendedProducts() {
  const active = state.catalog.filter(p => !state.excludedSkus.includes(p.sku));
  const profile = getResolvedProfile();

  if (state.module === "Belleza") {
    const pasos = ["Prebase / Primer", "Base / Tinte", "Corrector", "Fijación / Acabado"];
    const selected = [];
    pasos.forEach(paso => {
      const candidatos = active.filter(p => p.modulo === "Belleza" && p.paso === paso);
      if (candidatos.length > 0) {
        const match = candidatos.find(c =>
          c.necesidades.some(n =>
            n.toLowerCase().includes(profile.cobertura.toLowerCase()) ||
            n.toLowerCase().includes(profile.acabado.toLowerCase())
          )
        ) || candidatos[0];
        selected.push({ ...match, isOptional: false, rationale: buildRationale(match, profile) });
      }
    });
    return selected;
  }

  const dermoPool = active.filter(p => p.modulo === "Dermocosmetica");

  function pickBestForStep(paso) {
    let pool = dermoPool.filter(p =>
      p.paso === paso &&
      p.presupuesto === profile.budget &&
      p.pieles.some(s => s.toLowerCase() === profile.skin.toLowerCase())
    );
    if (pool.length === 0) {
      pool = dermoPool.filter(p =>
        p.paso === paso &&
        p.pieles.some(s => s.toLowerCase() === profile.skin.toLowerCase())
      );
    }
    if (pool.length === 0) return null;

    pool.sort((a, b) => {
      let scoreA = 0, scoreB = 0;
      if (a.necesidades.some(n => n.toLowerCase().includes(profile.need.toLowerCase()))) scoreA += 3;
      if (b.necesidades.some(n => n.toLowerCase().includes(profile.need.toLowerCase()))) scoreB += 3;
      if (profile.texture && a.textura.toLowerCase() === profile.texture.toLowerCase()) scoreA += 2;
      if (profile.texture && b.textura.toLowerCase() === profile.texture.toLowerCase()) scoreB += 2;
      return scoreB - scoreA;
    });
    const chosen = pool[0];
    return { ...chosen, rationale: buildRationale(chosen, profile) };
  }

  if (state.isMenBeginner) {
    const pasosMen = ["Limpiador", "Hidratante", "Protector Solar"];
    const encontrados = pasosMen.map(pickBestForStep).filter(Boolean);

    if (state.answers.menInicio === "Con un producto" && encontrados.length > 0) {
      const idxPrincipal = encontrados.findIndex(p => p.paso === "Hidratante" || p.paso === "Protector Solar");
      const mainIdx = idxPrincipal >= 0 ? idxPrincipal : 0;
      return encontrados.map((item, i) => ({
        ...item,
        isOptional: i !== mainIdx
      }));
    }
    return encontrados.slice(0, 3).map(item => ({ ...item, isOptional: false }));
  }

  const pasosStd = ["Limpiador", "Serum", "Hidratante", "Protector Solar"];
  return pasosStd.map(pickBestForStep).filter(Boolean).map(item => ({ ...item, isOptional: false }));
}

function renderCart() {
  const countEl = document.getElementById("cart-count");
  const itemsEl = document.getElementById("cart-items");
  const totalEl = document.getElementById("cart-total");
  const totalUnits = state.cart.reduce((s, i) => s + i.qty, 0);
  const totalPrice = state.cart.reduce((s, i) => s + (i.precio * i.qty), 0);

  countEl.textContent = totalUnits;
  totalEl.textContent = formatCLP(totalPrice);

  if (state.cart.length === 0) {
    itemsEl.innerHTML = `<p style="color:var(--muted);font-size:14px;">Aún no agregas productos a tu selección.</p>`;
    return;
  }

  itemsEl.innerHTML = state.cart.map(item => `
    <div class="cart-item">
      <div>
        <div style="font-size:11px;font-weight:700;color:var(--muted);">${item.marca} · SKU ${item.sku}</div>
        <div style="font-size:13.5px;font-weight:800;color:var(--ahumada-navy);">${item.nombre}</div>
        <div style="font-size:13.5px;font-weight:800;color:var(--ahumada-red);margin-top:2px;">${formatCLP(item.precio * item.qty)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button type="button" class="pill-btn" data-action="cart-dec" data-sku="${item.sku}">-</button>
        <strong>${item.qty}</strong>
        <button type="button" class="pill-btn" data-action="cart-inc" data-sku="${item.sku}">+</button>
      </div>
    </div>
  `).join("");
}

document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case "reset":
      state.screen = "welcome";
      state.stepIndex = 0;
      state.isAdvancing = false;
      state.isMenBeginner = false;
      state.answers = createEmptyAnswers();
      state.excludedSkus = [];
      render();
      break;

    case "select-gender":
      state.gender = state.gender === target.dataset.val ? "" : target.dataset.val;
      render();
      break;

    case "start-module":
    case "quick-module":
      state.module = target.dataset.module;
      state.stepIndex = 0;
      state.isAdvancing = false;
      state.answers = createEmptyAnswers();
      state.excludedSkus = [];
      if (state.module === "Belleza") {
        state.isMenBeginner = false;
        state.screen = "beauty_quiz";
      } else if (state.gender === "Hombre") {
        state.screen = "men_gate";
      } else {
        state.isMenBeginner = false;
        state.screen = "dermo_quiz";
      }
      render();
      break;

    case "men-gate-choice":
      state.isMenBeginner = target.dataset.beginner === "true";
      state.stepIndex = 0;
      state.screen = state.isMenBeginner ? "men_quiz" : "dermo_quiz";
      render();
      break;

    case "answer-single": {
      if (state.isAdvancing) return;
      state.isAdvancing = true;
      const key = target.dataset.key;
      const val = target.dataset.val;
      state.answers[key] = val;

      // Micro-confirmación visual limpia de 180 ms sin sticky hover
      document.querySelectorAll(".option-card").forEach(c => c.classList.remove("selected", "flash-confirm"));
      target.classList.add("flash-confirm");

      setTimeout(() => {
        const list = state.screen === "men_quiz" ? MEN_QUESTIONS : (state.screen === "dermo_quiz" ? DERMO_QUESTIONS : BEAUTY_QUESTIONS);
        if (state.stepIndex < list.length - 1) {
          state.stepIndex++;
        } else {
          state.screen = "results";
        }
        state.isAdvancing = false;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, 180);
      break;
    }

    case "toggle-multi": {
      const key = target.dataset.key;
      const val = target.dataset.val;
      let arr = Array.isArray(state.answers[key]) ? [...state.answers[key]] : [];
      if (arr.includes(val)) {
        arr = arr.filter(x => x !== val);
      } else {
        if (val === "Solo agua") arr = ["Solo agua"];
        else arr = arr.filter(x => x !== "Solo agua").concat(val);
      }
      state.answers[key] = arr;
      render();
      break;
    }

    case "next-step": {
      const list = state.screen === "men_quiz" ? MEN_QUESTIONS : (state.screen === "dermo_quiz" ? DERMO_QUESTIONS : BEAUTY_QUESTIONS);
      if (state.stepIndex < list.length - 1) state.stepIndex++;
      else state.screen = "results";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
    }

    case "prev-step":
      state.isAdvancing = false;
      if (state.stepIndex > 0) {
        state.stepIndex--;
      } else if (state.gender === "Hombre" && state.module === "Dermocosmetica") {
        state.screen = "men_gate";
      } else {
        state.screen = "welcome";
      }
      render();
      break;

    case "change-budget":
      state.answers.presupuesto = target.dataset.val;
      render();
      break;

    case "exclude-sku":
      if (!state.excludedSkus.includes(target.dataset.sku)) {
        state.excludedSkus.push(target.dataset.sku);
      }
      render();
      break;

    case "restore-excluded":
      state.excludedSkus = [];
      render();
      break;

    case "add-cart": {
      const prod = state.catalog.find(p => p.sku === target.dataset.sku);
      if (prod) {
        const existing = state.cart.find(c => c.sku === prod.sku);
        if (existing) existing.qty++;
        else state.cart.push({ ...prod, qty: 1 });
        renderCart();
        showToast("Agregado a tu selección");
      }
      break;
    }

    case "add-all": {
      const recs = getRecommendedProducts().filter(r => !r.isOptional);
      recs.forEach(prod => {
        const existing = state.cart.find(c => c.sku === prod.sku);
        if (existing) existing.qty++;
        else state.cart.push({ ...prod, qty: 1 });
      });
      renderCart();
      document.getElementById("drawer-backdrop").style.display = "block";
      document.getElementById("cart-drawer").style.display = "flex";
      break;
    }

    case "open-cart":
      renderCart();
      document.getElementById("drawer-backdrop").style.display = "block";
      document.getElementById("cart-drawer").style.display = "flex";
      break;

    case "close-cart":
      document.getElementById("drawer-backdrop").style.display = "none";
      document.getElementById("cart-drawer").style.display = "none";
      break;

    case "cart-inc": {
      const item = state.cart.find(c => c.sku === target.dataset.sku);
      if (item) item.qty++;
      renderCart();
      break;
    }

    case "cart-dec": {
      const idx = state.cart.findIndex(c => c.sku === target.dataset.sku);
      if (idx >= 0) {
        if (state.cart[idx].qty > 1) state.cart[idx].qty--;
        else state.cart.splice(idx, 1);
      }
      renderCart();
      break;
    }

    case "copy-summary": {
      const items = state.cart.length ? state.cart : getRecommendedProducts().map(p => ({ ...p, qty: 1 }));
      const lines = ["*Mi Rutina Recomendada - Farmacias Ahumada*", ""];
      items.forEach((it, i) => {
        lines.push(`${i + 1}. ${it.marca} - ${it.nombre} (SKU ${it.sku}): ${formatCLP(it.precio * it.qty)}`);
      });
      const total = items.reduce((s, it) => s + it.precio * it.qty, 0);
      lines.push("", `Total estimado: ${formatCLP(total)}`);
      navigator.clipboard.writeText(lines.join("\n")).then(() => showToast("Resumen copiado al portapapeles"));
      break;
    }

    case "reserve-store":
      showToast("Código de selección generado para mesón de Farmacias Ahumada");
      break;
  }
});

loadCatalog();
</script>
</body>
